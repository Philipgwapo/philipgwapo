name: Build Nokia Mode APK

on:
  push:
    paths:
      - "nokia-dumb-mode/**"
      - ".github/workflows/nokia-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nokia-dumb-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nokia-mode-apk
          path: nokia-dumb-mode/app/build/outputs/apk/release/*.apk
